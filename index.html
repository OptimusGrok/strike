<script>
'use strict';
// ===== STRIKE core: constants, utils, pools, font, input, layout =====
const W = 270, TAU = Math.PI * 2;
// Portrait-first: width is fixed at 270 logical px; height stretches 480..584 to fill tall phones (rest letterboxed).
let H = 480;
(function () { const a = (window.innerHeight || 480) / (window.innerWidth || 270); H = Math.round(clamp(270 * a, 480, 584) / 2) * 2; })();
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
let S = 2;                       // backing-store pixels per logical pixel
const VIEW = { l: 0, t: 0, w: W, h: H, sc: 1 };
const DEV = /dev/.test(location.hash) || /dev/.test(location.search);

let _seed = 12345;

function ri(a, b) { return (a + Math.floor((b - a + 1) * rnd())); }

// ---- object pool with free-list (no per-frame allocation) ----

  get() { if (!this.nf) return null; const o = this.items[this.free[--this.nf]]; o.alive = true; this.count++; return o; }

  clear() { const a = this.items; for (let i = 0; i < a.length; i++) if (a[i].alive) this.kill(a[i]); }
}

// ---- options + storage ----

// ---- layout / letterbox ----
function resize() {

  canvas.style.left = Math.floor((vw - cw) / 2) + 'px'; canvas.style.top = Math.floor((vh - ch) / 2) + 'px';
  const dpr = window.devicePixelRatio || 1;
  S = clamp(Math.round(sc * dpr), 1, MAX_S);

}
window.addEventListener('resize', resize);

const fontAtlas = {};

}
function textW(str, sc) { return str.length * 6 * (sc || 1) - (sc || 1); }

  }

// ---- input ----
const Input = {

  taps: [], touchMode: ('ontouchstart' in window) || navigator.maxTouchPoints > 0, botMove: null,

const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  KeyZ: 'fire', Space: 'fire', KeyJ: 'fire', KeyX: 'bomb', KeyK: 'bomb', ShiftLeft: 'focus', ShiftRight: 'focus',
  KeyP: 'pause', Escape: 'pause', Enter: 'start', KeyM: 'mute'

window.addEventListener('keydown', e => {
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault(); Snd.unlock();

  Input.keys[k] = true; Input.touchMode = false;
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { Input.keys[k] = false; e.preventDefault(); } });
window.addEventListener('blur', () => { for (const k in Input.keys) Input.keys[k] = false; });

const DRAG_SENS = 1.25;
window.addEventListener('pointerdown', e => {
  Snd.unlock(); e.preventDefault();
  if (e.pointerType !== 'mouse') Input.touchMode = true;
  const p = toLogical(e.clientX, e.clientY);
  // on-screen buttons get first refusal
  if (UI.hitButton(p.x, p.y)) return;
  Input.taps.push(p.x, p.y);

}, { passive: false });

  if (e.pointerId !== Input.dragId) return;
  e.preventDefault();
  const sc = VIEW.sc;
  Input.dragX += (e.clientX - Input.lastX) / sc * DRAG_SENS; Input.dragY += (e.clientY - Input.lastY) / sc * DRAG_SENS;
  Input.lastX = e.clientX; Input.lastY = e.clientY;
}, { passive: false });

document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// ===== STRIKE audio: WebAudio synth soundtrack + SFX (all generated) =====

const SONGS = {

  s1: { bpm: 148, key: 45, scale: 'minor', cut: 1300, secs: [[[0, 5, 2, 6], 'rock', 'eighth', 0, 1], [[0, 5, 2, 6], 'rock', 'eighth', 1, 1], [[3, 4, 0, 0], 'drive', 'gallop', 1, 0], [[5, 6, 0, 4], 'drive', 'eighth', 1, 1]] },
  s2: { bpm: 154, key: 43, scale: 'dor', cut: 1500, secs: [[[0, 6, 5, 6], 'drive', 'eighth', 0, 1], [[0, 6, 5, 6], 'drive', 'gallop', 1, 1], [[3, 3, 4, 4], 'rock', 'pulse', 1, 1], [[5, 6, 0, 0], 'dbl', 'gallop', 1, 0]] },
  s3: { bpm: 160, key: 40, scale: 'minor', cut: 1700, secs: [[[0, 0, 5, 6], 'drive', 'gallop', 0, 1], [[0, 3, 5, 4], 'drive', 'gallop', 1, 1], [[5, 5, 6, 6], 'dbl', 'pulse', 1, 0], [[3, 4, 0, 4], 'dbl', 'gallop', 1, 1]] },
  s4: { bpm: 166, key: 42, scale: 'harm', cut: 1900, secs: [[[0, 5, 0, 4], 'dbl', 'pulse', 0, 1], [[0, 5, 3, 4], 'dbl', 'gallop', 1, 1], [[5, 1, 4, 4], 'drive', 'pulse', 1, 1], [[0, 6, 5, 4], 'dbl', 'gallop', 1, 0]] },
  s5: { bpm: 172, key: 40, scale: 'phryg', cut: 2200, secs: [[[0, 1, 0, 6], 'dbl', 'pulse', 1, 1], [[0, 1, 5, 6], 'dbl', 'gallop', 1, 1], [[3, 1, 0, 0], 'break', 'pulse', 1, 1], [[5, 6, 1, 0], 'dbl', 'gallop', 1, 1]] },
  boss: { bpm: 172, key: 41, scale: 'harm', cut: 2000, secs: [[[0, 0, 5, 4], 'dbl', 'gallop', 1, 0], [[0, 3, 4, 4], 'dbl', 'pulse', 1, 1], [[5, 1, 4, 0], 'break', 'gallop', 1, 1]] },
  final: { bpm: 182, key: 38, scale: 'phryg', cut: 2400, secs: [[[0, 1, 0, 1], 'dbl', 'pulse', 1, 1], [[0, 1, 5, 4], 'dbl', 'gallop', 1, 1], [[3, 1, 6, 0], 'break', 'pulse', 1, 1], [[5, 4, 1, 0], 'dbl', 'gallop', 1, 1]] },
  clear: { bpm: 140, key: 48, scale: 'major', cut: 1800, once: 1, secs: [[[0, 3, 4, 0], 'rock', 'eighth', 1, 1, 2]] },
  ending: { bpm: 126, key: 48, scale: 'major', cut: 1600, secs: [[[0, 5, 3, 4], 'half', 'long', 1, 1], [[0, 5, 3, 4], 'rock', 'eighth', 1, 1], [[3, 4, 5, 4], 'rock', 'eighth', 1, 1]] },
  over: { bpm: 90, key: 45, scale: 'minor', cut: 900, once: 1, secs: [[[0, 5, 3, 4], 'none', 'long', 1, 0, 2]] },

const DRUMS = {
  rock: { k: [0, 8, 10], s: [4, 12], h: 2 }, drive: { k: [0, 3, 6, 8, 11, 14], s: [4, 12], h: 1 },
  dbl: { k: [0, 2, 4, 6, 8, 10, 12, 14], s: [4, 12], h: 1, crash: 1 }, half: { k: [0], s: [8], h: 2 },
  break: { k: [0, 6, 10], s: [4, 12, 15], h: 1 }, none: { k: [], s: [], h: 0 },

const Snd = {
  ctx: null, master: null, mus: null, fx: null, lead: null, noise: null, hum: null,
  song: null, sname: '', step: 0, nextT: 0, timer: 0, last: Object.create(null), mel: null, played: [],

  },
  build() {

  },
  sched(t, sp) {
    const sg = this.song, secLen = (i) => (sg.secs[i][5] || 4) * 16;

function mkC(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function pix(c, outline) {
  const x = c.getContext('2d'), w = c.width, h = c.height, d = x.getImageData(0, 0, w, h), p = d.data;
  for (let i = 3; i < p.length; i += 4) p[i] = p[i] > 96 ? 255 : 0;
  if (outline !== false) {
    const m = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) for (let X = 0; X < w; X++) {
      const i = y * w + X; if (p[i * 4 + 3]) continue;
      if ((X > 0 && p[(i - 1) * 4 + 3] === 255) || (X < w - 1 && p[(i + 1) * 4 + 3] === 255) || (y > 0 && p[(i - w) * 4 + 3] === 255) || (y < h - 1 && p[(i + w) * 4 + 3] === 255)) m[i] = 1;
    }
    for (let i = 0; i < m.length; i++) if (m[i]) { p[i * 4] = 10; p[i * 4 + 1] = 8; p[i * 4 + 2] = 22; p[i * 4 + 3] = 255; }
  }
  if (outline !== false) bevel(p, w, h);
  x.putImageData(d, 0, 0);
}
function bevel(p, w, h) {
  const o = new Uint8ClampedArray(p);
  const solid = i => o[i * 4 + 3] === 255 && !(o[i * 4] === 10 && o[i * 4 + 1] === 8 && o[i * 4 + 2] === 22);
  for (let y = 0; y < h; y++) for (let X = 0; X < w; X++) {
    const i = y * w + X; if (!solid(i)) continue;
    const up = y > 0 && solid(i - w), lf = X > 0 && solid(i - 1), dn = y < h - 1 && solid(i + w), rt = X < w - 1 && solid(i + 1);
    let k = 0; if (!up || !lf) k = 0.32; else if (!dn || !rt) k = -0.3;
    if (k) for (let c = 0; c < 3; c++) { const v = o[i * 4 + c]; p[i * 4 + c] = k > 0 ? v + (255 - v) * k : v * (1 + k); }
  }
}

function blit(img, x, y, flash) { ctx.drawImage(flash ? img.flash : img, Math.round(x - img.width / 2), Math.round(y - img.height / 2)); }
function blitRot(img, x, y, a) { ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(a); ctx.drawImage(img, -img.width / 2, -img.height / 2); ctx.restore(); }
